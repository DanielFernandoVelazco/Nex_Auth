<div class="flex items-center gap-space-sm pl-space-sm">
    <div class="hidden sm:flex flex-col items-end">
        <span class="font-headline-sm text-headline-sm text-on-surface leading-tight">
            {{ userName() }}
        </span>
        <span class="font-label-caps text-label-caps text-on-surface-variant">
            {{ userRole() }}
        </span>
    </div>
    <button type="button" (click)="logout()"
        class="w-8 h-8 rounded-full bg-primary-container text-on-primary flex items-center justify-center shadow-sm text-[13px] font-semibold hover:ring-2 hover:ring-primary transition-all"
        title="Cerrar sesión">
        {{ userInitials() }}
    </button>
</div>
