<div class="flex flex-col gap-space-sm">

    <!-- Template selector -->
    <div class="flex items-center justify-between">
        <label class="font-headline-sm text-headline-sm text-on-surface">Plantilla de Email Activa</label>
        <button type="button" class="font-label-code-sm text-label-code-sm text-primary hover:underline">
            Editar HTML
        </button>
    </div>

    <div class="flex items-center gap-space-xs p-1 bg-surface-container-low rounded-lg">
        @for (tpl of templates(); track tpl.id) {
        <button type="button" (click)="switchTemplate(tpl.id)"
            class="flex-1 py-1 rounded font-headline-sm text-headline-sm transition-all" [class]="activeTemplate() === tpl.id
          ? 'bg-surface-container-lowest text-primary shadow-sm'
          : 'text-on-surface-variant hover:text-on-surface'">
            {{ tpl.label }}
        </button>
        }
    </div>

    <!-- Preview frame -->
    <div class="p-space-md rounded-lg bg-surface-container-low mt-2 flex flex-col gap-space-sm shadow-inner">

        <div class="flex items-center justify-between pb-space-xs border-b border-outline-variant/30">
            <span class="font-label-code-sm text-label-code-sm text-outline">
                Remitente: <strong class="text-on-surface">{{ senderEmail() }}</strong>
            </span>
            <span class="font-label-code-sm text-label-code-sm text-outline">Previsualización Sandbox</span>
        </div>

        @if (currentTemplate(); as tpl) {
        <div
            class="p-space-lg rounded-xl bg-surface-container-lowest shadow-sm flex flex-col items-center text-center gap-space-sm">

            <div class="w-10 h-10 rounded-full bg-primary-container/10 flex items-center justify-center text-primary">
                <span class="material-symbols-outlined text-[24px]">{{ tpl.icon }}</span>
            </div>

            <h3 class="font-headline-md text-headline-md text-on-surface">{{ tpl.title }}</h3>

            <p class="font-body-sm text-body-sm text-on-surface-variant max-w-xs">
                {{ tpl.description }}
            </p>

            <div
                class="tracking-widest font-label-code-lg text-label-code-lg px-space-lg py-2 rounded-lg bg-surface-container-high text-primary font-bold">
                {{ tpl.ctaLabel }}
            </div>

            <span class="font-label-code-sm text-label-code-sm text-outline">
                Válido durante 10 minutos. No lo compartas con nadie.
            </span>
        </div>
        }
    </div>
</div>
