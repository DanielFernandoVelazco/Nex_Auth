<div class="flex flex-col bg-surface-container-lowest">

    <!-- Header -->
    <div
        class="p-space-lg bg-surface-container-low flex items-center justify-between border-b border-surface-container">
        <div class="flex items-center gap-space-sm">
            <div class="w-9 h-9 rounded-lg bg-primary-container text-on-primary flex items-center justify-center">
                <span class="material-symbols-outlined text-[20px]">vpn_key</span>
            </div>
            <div class="flex flex-col">
                <h3 class="font-headline-md text-headline-md text-on-surface">Generar Nueva Clave API M2M</h3>
                <p class="font-body-sm text-body-sm text-on-surface-variant">Credencial de servicio con scopes
                    granulares</p>
            </div>
        </div>
        <button type="button" (click)="cancel()"
            class="text-outline hover:text-on-surface p-1 rounded-lg hover:bg-surface-container-high transition-colors">
            <span class="material-symbols-outlined text-[20px]">close</span>
        </button>
    </div>

    <!-- Body -->
    <div class="p-space-lg flex flex-col gap-space-md">

        <!-- Service Name -->
        <div class="flex flex-col gap-1">
            <label class="font-headline-sm text-headline-sm text-on-surface">Nombre del Servicio o Daemon</label>
            <input type="text" placeholder="ej. Billing Sync Daemon" [value]="serviceName()"
                (input)="onNameInput($event)"
                class="w-full bg-surface-container-low text-on-surface font-body-sm text-body-sm rounded-lg px-space-md py-2 focus:outline-none focus:bg-surface-container-lowest focus:ring-1 focus:ring-primary shadow-sm placeholder:text-outline" />
        </div>

        <!-- Environment -->
        <div class="flex flex-col gap-1">
            <label class="font-headline-sm text-headline-sm text-on-surface">Ambiente de Ejecución</label>
            <div class="grid grid-cols-2 gap-space-sm">
                <button type="button" (click)="setEnv('production')"
                    class="flex items-center gap-space-sm p-space-sm rounded-lg bg-surface-container-low cursor-pointer text-left transition-all"
                    [class.ring-2]="environment() === 'production'"
                    [class.ring-primary]="environment() === 'production'">
                    <span class="w-3 h-3 rounded-full shrink-0"
                        [class]="environment() === 'production' ? 'bg-primary' : 'bg-outline-variant'"></span>
                    <div class="flex flex-col">
                        <span class="font-headline-sm text-headline-sm text-on-surface">Production</span>
                        <span class="font-body-sm text-body-sm text-outline">Acceso a datos vivos</span>
                    </div>
                </button>
                <button type="button" (click)="setEnv('staging')"
                    class="flex items-center gap-space-sm p-space-sm rounded-lg bg-surface-container-low cursor-pointer text-left transition-all"
                    [class.ring-2]="environment() === 'staging'" [class.ring-primary]="environment() === 'staging'">
                    <span class="w-3 h-3 rounded-full shrink-0"
                        [class]="environment() === 'staging' ? 'bg-primary' : 'bg-outline-variant'"></span>
                    <div class="flex flex-col">
                        <span class="font-headline-sm text-headline-sm text-on-surface">Staging</span>
                        <span class="font-body-sm text-body-sm text-outline">Entorno sandbox</span>
                    </div>
                </button>
            </div>
        </div>

        <!-- Expiration -->
        <div class="flex flex-col gap-1">
            <label class="font-headline-sm text-headline-sm text-on-surface">Expiración Recomendada</label>
            <select [value]="expiryDays()" (change)="onExpiryChange($event)"
                class="bg-surface-container-low text-on-surface font-body-sm text-body-sm rounded-lg px-space-md py-2 focus:outline-none shadow-sm">
                <option [value]="30">30 días (CI/CD temporal)</option>
                <option [value]="90">90 días (Estándar corporativo)</option>
                <option [value]="365">1 Año</option>
                <option [value]="36500">Sin expiración (Requiere CISO)</option>
            </select>
        </div>

        <!-- Scopes -->
        <div class="flex flex-col gap-1">
            <label class="font-headline-sm text-headline-sm text-on-surface">
                Scopes Mínimos Necesarios (PoLP)
            </label>
            <div class="p-space-sm rounded-lg bg-surface-container-low flex flex-col gap-1.5 max-h-40 overflow-y-auto">
                @for (scope of availableScopes; track scope) {
                <label
                    class="flex items-center gap-space-sm font-label-code-sm text-label-code-sm text-on-surface cursor-pointer">
                    <input type="checkbox" [checked]="isScopeChecked(scope)" (change)="toggleScope(scope)"
                        class="rounded text-primary focus:ring-0" />
                    <span>{{ scope }}</span>
                </label>
                }
            </div>
        </div>

    </div>

    <!-- Footer -->
    <div
        class="px-space-lg py-space-md flex items-center justify-end gap-space-sm bg-surface-container-low border-t border-surface-container">
        <button type="button" (click)="cancel()"
            class="px-space-md py-space-sm rounded-lg bg-surface-container-lowest hover:bg-surface-container text-on-surface font-headline-sm text-headline-sm transition-colors">
            Cancelar
        </button>
        <button type="button" (click)="submit()" [disabled]="!isValid()"
            class="px-space-lg py-space-sm rounded-lg bg-primary-container text-on-primary font-headline-sm text-headline-sm shadow-md hover:bg-primary transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
            <span class="material-symbols-outlined text-[16px]">bolt</span>
            Generar y Revelar Secreto
        </button>
    </div>

</div>
